name: CI

on:
  push:
    branches: [main, prep]
  pull_request:
    branches: [main, prep]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run HTMLHint
        run: npm run htmlhint || true
      - name: Run Stylelint
        run: npm run stylelint || true
      - name: Lint (ESLint)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Export static site
        run: npm run export
      - name: Serve exported site
        run: npx serve out -s -l 8080 &
      - name: Wait for server
        run: |
          for i in {1..10}; do
            nc -z localhost 8080 && break || sleep 1
          done
      - name: Run Lighthouse CI (collect + assert)
        run: |
          npx -y @lhci/cli@0.10.2 autorun --config=./.lighthouserc.json
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
